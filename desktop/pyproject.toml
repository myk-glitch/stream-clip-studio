[project]
name = "twitchclipper"
version = "0.1.0"
description = "Local Windows desktop app that finds highlight moments from chat activity and cuts clips."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    # Essentials + Addons (QtMultimedia lives in Addons in 6.12). The full "PySide6"
    # meta-package also pulls WebEngine and PDF (~1 GB) which the app doesn't use.
    "PySide6-Essentials>=6.8",
    "PySide6-Addons>=6.8",
    "pyqtgraph>=0.13.7",
    "numpy>=2.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "keyring>=25.0",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
]

[project.scripts]
twitchclipper = "twitchclipper.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pytest-asyncio>=0.24", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twitchclipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
qt_api = "pyside6"
# Tests generate videos in tmp_path; keep those folders only for failed tests (no pile-up of copies).
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.coverage.run]
source = ["src/twitchclipper"]
branch = true
